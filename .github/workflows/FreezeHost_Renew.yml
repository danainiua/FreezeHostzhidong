name: FreezeHost 续期

on:
  schedule:
    - cron: '44 1 3 5 *'   # FREEZEHOST_DISCORD_TOKEN_1
    - cron: '37 2 21 4 *'  # FREEZEHOST_DISCORD_TOKEN_2
    - cron: '15 3 10 5 *'  # FREEZEHOST_DISCORD_TOKEN_3
    - cron: '20 4 15 5 *'  # FREEZEHOST_DISCORD_TOKEN_4
    - cron: '25 5 20 5 *'  # FREEZEHOST_DISCORD_TOKEN_5
  workflow_dispatch:
    inputs:
      token_number:
        description: '选择 Token 编号'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: write
      actions: write
      workflows: write

    steps:
      - name: 确定使用哪个 Token
        id: select_token
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOKEN_NUM="${{ github.event.inputs.token_number }}"
          else
            case "$HOUR" in
              01) TOKEN_NUM=1 ;;
              02) TOKEN_NUM=2 ;;
              03) TOKEN_NUM=3 ;;
              04) TOKEN_NUM=4 ;;
              05) TOKEN_NUM=5 ;;
              *) TOKEN_NUM=1 ;;
            esac
          fi
          echo "token_number=$TOKEN_NUM" >> "$GITHUB_OUTPUT"
          echo "::notice::选择 Token 编号: $TOKEN_NUM"

      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          echo "[INFO] 停用 systemd-resolved..."
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2
          echo "[INFO] 当前出口 IP:"
          curl -s --max-time 10 https://api.ipify.org && echo

      - name: 设置 Discord Token
        run: |
          TOKEN_NUM="${{ steps.select_token.outputs.token_number }}"
          case "$TOKEN_NUM" in
            1) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
            2) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_2 }}" >> "$GITHUB_ENV" ;;
            3) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_3 }}" >> "$GITHUB_ENV" ;;
            4) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_4 }}" >> "$GITHUB_ENV" ;;
            5) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_5 }}" >> "$GITHUB_ENV" ;;
            *) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
          esac
          echo "::notice::已设置 Token 编号: $TOKEN_NUM"

      - name: 运行续期脚本
        id: run_renew
        env:
          FREEZEHOST_DISCORD_TOKEN: ${{ env.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "使用 Token 编号: ${{ steps.select_token.outputs.token_number }}"
          python renew.py 2>&1 | tee renew.log

      - name: 提取剩余天数
        id: extract_days
        if: success()
        run: |
          set -e
          MIN_DAYS=""
          
          if [ -f "renew_result.json" ]; then
            MIN_DAYS=$(jq -r '.min_remaining_days // empty' renew_result.json)
          fi
          
          if [ -z "$MIN_DAYS" ] && [ -f "renew.log" ]; then
            MIN_DAYS=$(grep -oP '\d+(?=\s*DAYS?)' renew.log | sort -n | head -n1 || echo "0")
          fi
          
          if [ -z "$MIN_DAYS" ] || [ "$MIN_DAYS" = "0" ]; then
            echo "::warning::未找到有效剩余天数"
            echo "skip_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "remaining_days=$MIN_DAYS" >> "$GITHUB_OUTPUT"
          echo "skip_update=false" >> "$GITHUB_OUTPUT"
          echo "::notice::最小剩余天数: $MIN_DAYS 天"

      - name: 修改 Cron 时间
        if: success() && steps.extract_days.outputs.skip_update != 'true'
        run: |
          set -e
          REMAINING_DAYS="${{ steps.extract_days.outputs.remaining_days }}"
          TOKEN_NUM="${{ steps.select_token.outputs.token_number }}"
          
          if (( $(echo "$REMAINING_DAYS > 2" | bc -l) )); then
            DAYS_UNTIL_NEXT_RUN=$(echo "$REMAINING_DAYS - 2" | bc)
          else
            DAYS_UNTIL_NEXT_RUN=0.5
          fi
          
          DAYS_INT=$(printf "%.0f" "$DAYS_UNTIL_NEXT_RUN")
          NEXT_DAY=$(date -u -d "+${DAYS_INT} days" +"%-d")
          NEXT_MONTH=$(date -u -d "+${DAYS_INT} days" +"%-m")
          NEXT_HOUR=$((TOKEN_NUM + 0))  # 1~5 对应小时
          NEXT_MINUTE=$(date -u +"%M")
          
          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"
          
          WORKFLOW_FILE=".github/workflows/FreezeHost_Renew.yml"
          
          sed -i "/FREEZEHOST_DISCORD_TOKEN_$TOKEN_NUM/c\    - cron: '$NEW_CRON' # FREEZEHOST_DISCORD_TOKEN_$TOKEN_NUM - 下一次自动续期" "$WORKFLOW_FILE"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "自动调整 FREEZEHOST_DISCORD_TOKEN_$TOKEN_NUM 下次续期时间" || echo "No changes"
          git push
          echo "::notice::✅ Cron 已更新"

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
